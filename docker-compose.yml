services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    working_dir: /app
    command: crystal run src/app.cr --error-trace
    env_file:
      - .env.example
    environment:
      KEMAL_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kemalcr_development
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - shards-cache:/root/.cache/shards
      - crystal-cache:/root/.cache/crystal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kemalcr_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kemalcr_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  shards-cache:
  crystal-cache: